[package]
name = "neovim-config-test"
version = "0.1.0"
description = "Sample TOML for treesitter highlighting test"

[settings]
enabled = true
debug = false
log_level = "info"
max_retries = 3

[presets.basic]
aliases = ["vi"]
colorscheme = "catppuccin-frappe"

[presets.basic.categories]
general = true
themer = true

[presets.full]
aliases = ["nvim"]
colorscheme = "catppuccin-frappe"

[presets.full.categories]
general = true
neonixdev = true
webDev = true
lint = true
format = true
debug = true
markdown = true
themer = true

[[lsps]]
name = "lua_ls"
filetypes = ["lua"]

[[lsps]]
name = "nixd"
filetypes = ["nix"]

[[lsps]]
name = "ts_ls"
filetypes = ["typescript", "javascript", "typescriptreact", "javascriptreact"]

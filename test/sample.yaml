---
name: neovim-config-test
version: "1.0.0"
description: Sample YAML for treesitter highlighting test

settings:
  enabled: true
  debug: false
  loglevel: info

presets:
  - name: basic
    aliases: [vi]
    categories:
      general: true
      themer: true
    colorscheme: catppuccin-frappe

  - name: full
    aliases: [nvim]
    categories:
      general: true
      neonixdev: true
      webDev: true
      lint: true
      format: true
      debug: true
      markdown: true
      themer: true
    colorscheme: catppuccin-frappe

services:
  watchdog:
    enabled: true
    timeout: 300
    flags:
      pending: /run/deployment-pending
      confirmed: /run/deployment-confirmed

nested:
  deep:
    key: value
    list:
      - one
      - two
      - three

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Page</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <header class="site-header">
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Hello, World</h1>
            <p>This file tests <strong>nvim-ts-autotag</strong> and <em>emmet</em>.</p>
        </section>

        <article>
            <h2>Tag Renaming</h2>
            <p>Rename a tag with <code>nvim-ts-autotag</code> — the paired tag updates automatically.</p>
            <div class="card">
                <img src="placeholder.png" alt="placeholder image" />
                <span>caption text</span>
            </div>
        </article>

        <form action="/submit" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />

            <label for="role">Role</label>
            <select id="role" name="role">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 — test file</p>
    </footer>

    <script src="./app.js"></script>
</body>
</html>
